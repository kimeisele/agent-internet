name: Federation Heartbeat

on:
  schedule:
    - cron: '3-59/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Install nadi-kit
        id: install-nadi-kit
        env:
          GH_TOKEN: ${{ secrets.FEDERATION_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install cryptography
          # S1 (program slice 0c): fetch nadi_kit.py at a pinned blob SHA
          # (content-addressed), never mutable main. The blob SHA survives hub
          # history rewrites; the digest is verified before execution.
          curl -sL -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/kimeisele/steward-federation/git/blobs/47d8e3bbd9cb4256612df1e21ded38b3beb48aa3" \
            | python3 -c "import base64,json,sys; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)['content']))" \
            > nadi_kit.py
          [ "$(git hash-object nadi_kit.py)" = "47d8e3bbd9cb4256612df1e21ded38b3beb48aa3" ] \
            || { echo "nadi_kit.py digest mismatch (S1 pin)"; exit 1; }

      - name: Run NADI heartbeat cycle
        env:
          NODE_PRIVATE_KEY: ${{ secrets.NODE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.FEDERATION_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.FEDERATION_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python3 nadi_kit.py sync
          python3 nadi_kit.py heartbeat
          echo "Heartbeat generated (outbox will be relayed before final sync)"

      - name: Relay outbox to steward-federation hub
        if: always()
        env:
          GH_TOKEN: ${{ secrets.FEDERATION_PAT || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/federation
          OUTBOX="data/federation/nadi_outbox.json"

          if [ ! -f "$OUTBOX" ]; then
            echo "[]" > "$OUTBOX"
          fi

          if [ "$(cat "$OUTBOX" | tr -d '[:space:]')" = "[]" ]; then
            echo "Outbox empty, skipping relay"
            exit 0
          fi

          git clone --depth=1 https://x-access-token:${GH_TOKEN}@github.com/kimeisele/steward-federation.git /tmp/hub

          mkdir -p /tmp/hub/nadi

          cp "$OUTBOX" /tmp/hub/nadi/agent-internet_to_steward.json

          cd /tmp/hub
          git config user.name "federation-bot"
          git config user.email "bot@federation"
          git add nadi/agent-internet_to_steward.json
          git diff --cached --quiet || git commit -m "relay: agent-internet outbox → steward (heartbeat #${{ github.run_number }})"
          max_retries=10
          count=0
          until git push origin main; do
            count=$((count+1))
            if [ $count -gt $max_retries ]; then
              echo "Push failed after $max_retries attempts"
              exit 1
            fi
            backoff=$(( (RANDOM % 15) + 2 ))
            echo "Race condition. Backoff ${backoff}s then rebase..."
            sleep $backoff
            git pull --rebase origin main
          done

          echo "[]" > "$OUTBOX"
          echo "Outbox relayed and cleared"

      - name: Final NADI sync
        # Run even when an earlier step failed, but never with unverified
        # nadi_kit bytes: the digest gate must have succeeded first (S1).
        if: always() && steps.install-nadi-kit.outcome == 'success'
        env:
          NODE_PRIVATE_KEY: ${{ secrets.NODE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.FEDERATION_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.FEDERATION_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python3 nadi_kit.py sync
          echo "Final sync complete"
